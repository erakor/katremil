name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint, format, knip, unit tests and `next build`.
  checks:
    uses: erakor/toolchain/.github/workflows/node-checks.yml@2234c80a5e2162b9ff6853304544715722461261 # v1.5.0 once tagged
    with:
      build: true
